<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxel AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            align-items: center;
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        /* Кнопки */
        .btn-gray {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .btn-gray:active {
            background-color: #444444;
        }
        /* Чат */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
            padding-bottom: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
        }
        .message.user {
            background-color: #007aff;
            align-self: flex-end;
        }
        .message.bot {
            background-color: #262626;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .btn-send {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Главный вход с серой кнопкой -->
    <div id="screen-home" class="screen active">
        <div style="margin-top: auto;"></div>
        <button class="btn-gray" onclick="goToScreen('screen-assistant')">Помощник</button>
        <div style="margin-bottom: auto;"></div>
    </div>

    <!-- ЭКРАН 2: Экран помощника -->
    <div id="screen-assistant" class="screen">
        <h1>Oxel — Ваш помощник ИИ!</h1>
        <button class="btn-gray" onclick="goToScreen('screen-chat')">Задать вопрос</button>
    </div>

    <!-- ЭКРАН 3: Чат -->
    <div id="screen-chat" class="screen" style="padding: 0;">
        <div class="chat-container">
            <div style="padding: 10px 0; border-bottom: 1px solid #222; font-weight: bold;">Oxel Chat</div>
            <div id="messages" class="chat-messages">
                <!-- Сюда падают сообщения -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Функция переключения экранов
        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Логика чата
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // Выводим сообщение пользователя
            appendMessage(text, 'user');
            input.value = '';

            // Проверяем условие для бота
            setTimeout(() => {
                if (text.toLowerCase() === 'привет') {
                    appendMessage('Привет! Как дела?', 'bot');
                } else {
                    appendMessage('Я пока учусь отвечать только на "Привет"!', 'bot');
                }
            }, 500);
        }

        function appendMessage(text, sender) {
            const messagesDiv = document.getElementById('messages');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.textContent = text;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
