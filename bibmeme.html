<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibmeme</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    /* шрифт по умолчанию для всей страницы */
    body {
      font-family: "Inter", sans-serif;
      font-size: 2rem;
    }

    /* классы, которые можно навесить на любое слово или фразу */
    .inter    { font-family: "Inter", sans-serif; }
    .pacifico { font-family: "Pacifico", cursive; }
    .bold     { font-weight: 800; }
  </style>
</head>
<body>
  <p>Обычный текст шрифтом Inter</p>
  <p>А <span class="pacifico">эти слова</span> другим шрифтом</p>
  <p class="pacifico">Вся эта фраза шрифтом Pacifico</p>
  <p>Можно <span class="inter bold">и так</span></p>
</body>
</html>
