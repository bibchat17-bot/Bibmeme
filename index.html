<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bibmeme</title>
    <meta name="google-signin-client_id" content="754087180561-rvtiaemjn16g4s800emdfkmaskp49j64.apps.googleusercontent.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: white;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between p-4 select-none pt-10 overflow-x-hidden">

    <!-- Верхний заголовок -->
    <div id="top-header" class="flex flex-col items-center w-full mb-4 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">bibmeme</h1>
    </div>

    <!-- Основной контейнер экрана -->
    <div id="app-container" class="w-full max-w-sm mx-auto my-auto flex flex-col gap-3">
        
        <!-- Стартовый экран (Приветствие + Вход через Google) -->
        <div id="welcome-screen" class="w-full flex flex-col gap-3">
            <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-4 text-center shadow-lg w-full flex items-center justify-center gap-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
                </span>
                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2,2 0 114 0v1a1,1 0 001 1h3a1,1 0 011 1v3a1,1 0 011 1h-1a2,2 0 100 4h1a1,1 0 011 1v3a1,1 0 01-1 1h-3a1,1 0 01-1-1v-1a2,2 0 10-4 0v1a1,1 0 01-1 1H7a1,1 0 01-1-1v-3a1,1 0 00-1-1H4a2,2 0 110-4h1a1,1 0 001-1V7a1,1 0 011-1h3a1,1 0 001-1V4z"></path></svg>
                <span class="text-lg font-bold text-white tracking-wide">Проект делается!</span>
            </div>

            <button id="googleAuthBtn" onclick="loginWithGoogle()" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 rounded-2xl text-base transition flex items-center justify-center gap-3 shadow-md active:scale-95">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.87z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.24 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.14 0 9.99 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                <span>Войти через Google</span>
            </button>
            <p id="accountLimitError" class="text-red-400 text-xs text-center font-medium hidden"></p>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <div id="bottom-nav" class="hidden w-full max-w-sm mx-auto bg-[#1e1e1e] border border-white/10 rounded-2xl p-1.5 flex justify-around items-center shadow-lg mt-auto">
        <button onclick="switchTab('servers')" id="nav-servers" class="flex-1 py-2 text-center font-bold text-xs text-gray-400 hover:text-white transition rounded-xl">Сервера</button>
        <button onclick="switchTab('feed')" id="nav-feed" class="flex-1 py-2 text-center font-bold text-xs text-gray-400 hover:text-white transition rounded-xl">Лента</button>
        <button onclick="switchTab('adminServer')" id="nav-adminServer" class="hidden flex-1 py-2 text-center font-bold text-xs text-purple-400 hover:text-purple-300 transition rounded-xl">Сервер</button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex-1 py-2 text-center font-bold text-xs text-white bg-white/10 transition rounded-xl">Профиль</button>
    </div>

    <!-- Модальное окно создания поста -->
    <div id="createPostModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-5 w-full max-w-sm flex flex-col gap-3 max-h-[90vh] overflow-y-auto">
            <h2 class="text-lg font-bold">Создать пост</h2>
            <textarea id="postText" placeholder="Что у вас нового?" rows="3" class="w-full bg-[#121212] border border-white/20 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white"></textarea>
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-gray-400">Прикрепить фото (камера / галерея):</label>
                <input type="file" id="postImageInput" accept="image/*" class="text-xs text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-white file:text-black hover:file:bg-gray-200 cursor-pointer">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-gray-400">Возрастное ограничение:</label>
                <select id="postAgeLimit" class="w-full bg-[#121212] border border-white/20 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                    <option value="none">Оставить пустым (для всех)</option>
                    <option value="9-12">9-12 лет</option>
                    <option value="13-17">13-17 лет</option>
                    <option value="18+">18+</option>
                </select>
            </div>

            <div id="postStatusMsg" class="text-xs text-amber-400 font-medium text-center hidden">Выкладываем пост...</div>

            <div class="flex gap-2 pt-2">
                <button onclick="publishPost()" class="flex-1 bg-white text-black font-bold py-2.5 rounded-xl text-xs hover:bg-gray-200 transition">Опубликовать</button>
                <button onclick="closeCreatePostModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-2.5 rounded-xl text-xs transition">Отмена</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, addCollection, addDoc, getDocs, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:30b65e2900685b66817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUserData = null;
        let activeTab = 'profile';
        let unsubscribePosts = null;

        const OWNER_UIDS = ["X03NzVf3xPQLajxDwV1xNIf4nU42"];
        const ADMIN_UIDS = ["q4GyUEltlrS9KaSMoGYdbE4dkK13"];

        function getUserRole() {
            if (!currentUser || !currentUser.uid) return "user";
            if (OWNER_UIDS.includes(currentUser.uid)) return "owner";
            if (ADMIN_UIDS.includes(currentUser.uid)) return "admin";
            return "user";
        }

        function registerDeviceAccount(uid) {
            let accounts = JSON.parse(localStorage.getItem('device_registered_accounts') || '[]');
            if (!accounts.includes(uid)) {
                if (accounts.length >= 3) return false;
                accounts.push(uid);
                localStorage.setItem('device_registered_accounts', JSON.stringify(accounts));
            }
            return true;
        }

        const SIGNS = {
            owner: `<span class="inline-flex items-center gap-1.5 bg-red-600/30 text-red-400 border border-red-500/30 text-xs px-2.5 py-1 rounded-full font-bold">Владелец</span>`,
            admin: `<span class="inline-flex items-center gap-1.5 bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 text-xs px-2.5 py-1 rounded-full font-bold">Админ</span>`,
            user: `<span class="inline-flex items-center gap-1.5 bg-gray-800 text-gray-300 border border-gray-700 text-xs px-2.5 py-1 rounded-full font-medium">Участник</span>`
        };

        getRedirectResult(auth).then((result) => {
            if (result && result.user) {
                currentUser = result.user;
                handleUserAuthSuccess();
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await handleUserAuthSuccess();
            }
        });

        async function handleUserAuthSuccess() {
            if (!currentUser) return;
            let accounts = JSON.parse(localStorage.getItem('device_registered_accounts') || '[]');
            if (!accounts.includes(currentUser.uid)) {
                if (accounts.length >= 3) {
                    await signOut(auth);
                    const limitError = document.getElementById('accountLimitError');
                    if (limitError) {
                        limitError.textContent = "На этом устройстве уже создано 3 аккаунта! Доступ ограничен.";
                        limitError.classList.remove('hidden');
                    }
                    return;
                }
                accounts.push(currentUser.uid);
                localStorage.setItem('device_registered_accounts', JSON.stringify(accounts));
            }
            const welcomeScreen = document.getElementById('welcome-screen');
            if (welcomeScreen) welcomeScreen.classList.add('hidden');
            await checkUserSessionState();
        }

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                const result = await signInWithPopup(auth, provider);
                if (result && result.user) {
                    currentUser = result.user;
                    await handleUserAuthSuccess();
                }
            } catch (error) {
                try {
                    await signInWithRedirect(auth, provider);
                } catch (redirectErr) {
                    alert("Не удалось войти: " + redirectErr.message);
                }
            }
        };

        async function checkUserSessionState() {
            const container = document.getElementById('app-container');
            container.innerHTML = `<div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full"><p class="text-sm text-gray-300">Загрузка профиля...</p></div>`;

            try {
                const userDocRef = doc(db, "users", currentUser.uid);
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    currentUserData = userSnap.data();
                    if (checkSleepLock(currentUserData.age)) return;

                    if (currentUserData.hasPassword && !sessionStorage.getItem(`auth_verified_${currentUser.uid}`)) {
                        showPasswordLoginPrompt(currentUser.displayName);
                    } else {
                        document.getElementById('bottom-nav').classList.remove('hidden');
                        const role = getUserRole();
                        if (role === 'owner' || role === 'admin') document.getElementById('nav-adminServer').classList.remove('hidden');
                        switchTab('profile');
                    }
                } else {
                    showBirthdayPrompt(currentUser.displayName);
                }
            } catch (e) {
                showBirthdayPrompt(currentUser.displayName);
            }
        }

        function checkSleepLock(age) {
            if (age >= 18) return false;
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const totalCurrentMinutes = currentHour * 60 + currentMinute;
            const dateKey = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
            const isExtendedToday = localStorage.getItem(`sleep_ext_${currentUser.uid}_${dateKey}`) === "true";

            let sleepStartMinutes = (age >= 9 && age <= 12) ? 22 * 60 : (age <= 15 ? 23 * 60 : 0);
            let extensionLimitMinutes = (age >= 9 && age <= 12) ? 23 * 60 : (age <= 15 ? 24 * 60 : 60);

            if (totalCurrentMinutes >= sleepStartMinutes || currentHour < 6) {
                if (!isExtendedToday && totalCurrentMinutes < extensionLimitMinutes) {
                    return false;
                }
                showSleepLockScreen(age >= 9 && age <= 12 ? "9-12 лет" : "Подросток", true);
                return true;
            }
            return false;
        }

        function showSleepLockScreen(ageLabel, canExtend) {
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('app-container').innerHTML = `
                <div class="bg-[#1e1e1e] border border-indigo-500/30 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col items-center gap-4">
                    <p class="text-sm text-gray-200">Время отдыха (${ageLabel}). Приложение заблокировано.</p>
                    ${canExtend ? `<button onclick="extendSleepTime()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm">Отложить на 1 час</button>` : ''}
                </div>
            `;
        }

        window.extendSleepTime = function() {
            const now = new Date();
            localStorage.setItem(`sleep_ext_${currentUser.uid}_${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`, "true");
            location.reload();
        };

        function showPasswordLoginPrompt(userName) {
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('app-container').innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col gap-3">
                    <p class="text-sm text-gray-300">Введите пароль для входа:</p>
                    <input type="password" id="loginPassword" placeholder="Пароль" class="w-full bg-[#121212] border border-white/20 rounded-xl px-4 py-3 text-white text-sm">
                    <button onclick="verifyLoginPassword()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-base">Войти</button>
                    <p id="loginErrorMsg" class="text-red-400 text-sm hidden"></p>
                </div>
            `;
        }

        window.verifyLoginPassword = function() {
            if (document.getElementById('loginPassword').value === currentUserData.password) {
                sessionStorage.setItem(`auth_verified_${currentUser.uid}`, "true");
                document.getElementById('bottom-nav').classList.remove('hidden');
                switchTab('profile');
            } else {
                const err = document.getElementById('loginErrorMsg');
                err.textContent = "Неверный пароль!";
                err.classList.remove('hidden');
            }
        };

        function showBirthdayPrompt(userName) {
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('app-container').innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col gap-3">
                    <p class="text-xs text-gray-400">Укажите дату рождения</p>
                    <div class="flex gap-2">
                        <input type="number" id="birthDay" placeholder="День" class="w-1/3 bg-[#121212] border border-white/20 rounded-xl p-3 text-white text-center text-sm">
                        <input type="number" id="birthMonth" placeholder="Месяц" class="w-1/3 bg-[#121212] border border-white/20 rounded-xl p-3 text-white text-center text-sm">
                        <input type="number" id="birthYear" placeholder="Год" class="w-1/3 bg-[#121212] border border-white/20 rounded-xl p-3 text-white text-center text-sm">
                    </div>
                    <button onclick="proceedToPassword()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-base">Продолжить</button>
                    <p id="errorMsg" class="text-red-400 text-sm hidden"></p>
                </div>
            `;
        }

        let tempBirthdayData = null;
        window.proceedToPassword = function() {
            const day = parseInt(document.getElementById('birthDay').value);
            const month = parseInt(document.getElementById('birthMonth').value);
            const year = parseInt(document.getElementById('birthYear').value);
            if (!day || !month || !year) return;
            const today = new Date();
            let age = today.getFullYear() - year;
            tempBirthdayData = { fullBirthday: `${day}.${month}.${year}`, age, ageCategory: age >= 18 ? "18+" : "Подросток" };
            showPasswordCreationPrompt();
        };

        function showPasswordCreationPrompt() {
            document.getElementById('app-container').innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-5 text-left shadow-lg w-full flex flex-col gap-3">
                    <p class="text-xs text-gray-300">Придумайте пароль (мин. 6 символов, 2 цифры, _ , спецсимвол и заглавная буква)</p>
                    <input type="password" id="newPassword" placeholder="Пароль" class="w-full bg-[#121212] border border-white/20 rounded-xl p-3 text-white text-sm">
                    <button onclick="saveAccountWithPassword(true)" class="w-full bg-white text-black font-bold py-3 rounded-xl text-sm">Сохранить с паролем</button>
                    <button onclick="saveAccountWithPassword(false)" class="w-full bg-transparent border border-white/20 text-white font-bold py-2.5 rounded-xl text-xs">Пропустить</button>
                </div>
            `;
        }

        window.saveAccountWithPassword = async function(withPassword) {
            currentUserData = { uid: currentUser.uid, email: currentUser.email, displayName: currentUser.displayName, photoURL: currentUser.photoURL, ...tempBirthdayData, hasPassword: withPassword, password: withPassword ? document.getElementById('newPassword').value : "" };
            await setDoc(doc(db, "users", currentUser.uid), currentUserData);
            document.getElementById('bottom-nav').classList.remove('hidden');
            switchTab('profile');
        };

                // Управление вкладками
        window.switchTab = function(tabName) {
            activeTab = tabName;
            if (unsubscribePosts) { unsubscribePosts(); unsubscribePosts = null; }

            document.querySelectorAll('#bottom-nav button').forEach(btn => btn.classList.remove('bg-white/10', 'text-white'));
            const activeBtn = document.getElementById(`nav-${tabName}`);
            if (activeBtn) activeBtn.classList.add('bg-white/10', 'text-white');

            const container = document.getElementById('app-container');
            const topHeader = document.getElementById('top-header');

            if (tabName === 'profile') {
                topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Профиль</h1>`;
                container.innerHTML = `
                    <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-5 shadow-lg w-full flex flex-col gap-4">
                        <div class="flex items-center gap-4">
                            <img src="${currentUser.photoURL || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full border border-white/20 object-cover">
                            <div>
                                <h2 class="text-lg font-bold">${currentUser.displayName}</h2>
                                <p class="text-xs text-gray-400">${currentUser.email}</p>
                                <div class="mt-1.5">${SIGNS[getUserRole()]}</div>
                            </div>
                        </div>
                        <button onclick="signOut(auth); location.reload();" class="w-full bg-red-600/20 text-red-400 font-bold py-2.5 rounded-xl text-xs">Выйти</button>
                    </div>
                `;
            } else if (tabName === 'feed') {
                topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Лента мемов</h1>`;
                container.innerHTML = `
                    <button onclick="openCreatePostModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-2xl text-sm shadow-md transition flex items-center justify-center gap-2 mb-2">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        Создайте свой первый пост!
                    </button>
                    <div id="postsList" class="flex flex-col gap-3 w-full">
                        <p class="text-xs text-center text-gray-400">Загрузка ленты...</p>
                    </div>
                `;
                loadRealtimeFeed();
            } else if (tabName === 'servers') {
                topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Сервера</h1>`;
                container.innerHTML = `<div class="bg-[#1e1e1e] p-6 text-center rounded-2xl text-xs text-gray-400">Список серверов пуст</div>`;
            } else if (tabName === 'adminServer') {
                topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight text-purple-400">Управление Сервером</h1>`;
                container.innerHTML = `<div class="bg-[#1e1e1e] p-6 text-center rounded-2xl text-xs text-purple-300">Панель администратора активна</div>`;
            }
        };

        // --- ЛЕНТА И АЛГОРИТМЫ ПОСТОВ ---
        window.openCreatePostModal = function() {
            document.getElementById('createPostModal').classList.remove('hidden');
        };

        window.closeCreatePostModal = function() {
            document.getElementById('createPostModal').classList.add('hidden');
        };

        window.publishPost = async function() {
            const text = document.getElementById('postText').value.trim();
            const fileInput = document.getElementById('postImageInput');
            const ageLimit = document.getElementById('postAgeLimit').value;
            const statusMsg = document.getElementById('postStatusMsg');

            if (!text && fileInput.files.length === 0) {
                alert("Добавьте текст или фото для поста!");
                return;
            }

            statusMsg.classList.remove('hidden');

            let imageUrl = "";
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                imageUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            // АЛГОРИТМЫ РАНЖИРОВАНИЯ (популярность / залеталка)
            let algorithmScore = 10;
            if (imageUrl) algorithmScore += 50;
            if (text.length > 20) algorithmScore += 20;
            if (text.includes('#') || text.includes('мем') || text.includes('brawl')) algorithmScore += 30;

            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} (${now.getDate()}.${now.getMonth()+1})`;

            const newPost = {
                uid: currentUser.uid,
                authorName: currentUser.displayName,
                authorPhoto: currentUser.photoURL || 'https://via.placeholder.com/40',
                text: text,
                image: imageUrl,
                ageLimit: ageLimit,
                createdAt: now.getTime(),
                timeString: timeString,
                likes: [],
                comments: [],
                score: algorithmScore // Алгоритмический вес поста для ленты
            };

            try {
                await addDoc(collection(db, "posts"), newPost);
                document.getElementById('postText').value = "";
                fileInput.value = "";
                statusMsg.classList.add('hidden');
                closeCreatePostModal();
            } catch (e) {
                console.error("Ошибка публикации:", e);
                statusMsg.textContent = "Ошибка публикации!";
            }
        };

        function loadRealtimeFeed() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            unsubscribePosts = onSnapshot(q, (snapshot) => {
                const postsList = document.getElementById('postsList');
                if (!postsList) return;

                if (snapshot.empty) {
                    postsList.innerHTML = `<div class="bg-[#1e1e1e] p-6 text-center rounded-2xl text-xs text-gray-400">Пока нет постов. Будьте первыми!</div>`;
                    return;
                }

                let html = "";
                snapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const postId = docSnap.id;
                    const isLiked = post.likes && post.likes.includes(currentUser.uid);
                    const likesCount = post.likes ? post.likes.length : 0;
                    const commentsCount = post.comments ? post.comments.length : 0;

                    // Проверка возрастных ограничений
                    if (post.ageLimit === '18+' && currentUserData.age < 18) return;

                    html += `
                        <div class="bg-[#1e1e1e] border border-white/10 rounded-2xl p-4 shadow-lg w-full flex flex-col gap-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <img src="${post.authorPhoto}" class="w-9 h-9 rounded-full object-cover border border-white/20">
                                    <div>
                                        <h4 class="text-xs font-bold">${post.authorName}</h4>
                                        <span class="text-[10px] text-gray-400">${post.timeString} ${post.ageLimit !== 'none' ? `• <span class="text-amber-400">${post.ageLimit}</span>` : ''}</span>
                                    </div>
                                </div>
                                ${post.score > 70 ? `<span class="bg-orange-500/20 text-orange-400 border border-orange-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold">🔥 В топе</span>` : ''}
                            </div>

                            ${post.text ? `<p class="text-xs text-gray-200 leading-relaxed">${post.text}</p>` : ''}
                            ${post.image ? `<img src="${post.image}" class="rounded-xl max-h-64 w-full object-cover border border-white/10">` : ''}

                            <!-- Интерактивные кнопки (Лайк, Комментарии, Поделиться) -->
                            <div class="flex items-center justify-between pt-2 border-t border-white/10 text-xs text-gray-400">
                                <button onclick="toggleLike('${postId}', ${isLiked})" class="flex items-center gap-1.5 hover:text-red-500 transition ${isLiked ? 'text-red-500 font-bold' : ''}">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                    <span>${likesCount}</span>
                                </button>
                                <button onclick="toggleComments('${postId}')" class="flex items-center gap-1.5 hover:text-white transition">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                                    <span>${commentsCount}</span>
                                </button>
                                <button onclick="sharePost('${encodeURIComponent(post.text || 'Мем из bibmeme')}')" class="flex items-center gap-1.5 hover:text-white transition">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                                    <span>Поделиться</span>
                                </button>
                            </div>

                            <!-- Секция комментариев -->
                            <div id="comments-section-${postId}" class="hidden flex flex-col gap-2 pt-2 border-t border-white/10">
                                <div id="comments-list-${postId}" class="flex flex-col gap-1.5 max-h-32 overflow-y-auto">
                                    ${(post.comments || []).map(c => `<div class="bg-[#121212] p-2 rounded-lg text-[11px]"><strong class="text-indigo-400">${c.author}:</strong>${c.text}</div>`).join('') || '<p class="text-[10px] text-gray-500">Нет комментариев</p>'}
                                </div>
                                <div class="flex gap-2 mt-1">
                                    <input type="text" id="comment-input-${postId}" placeholder="Написать коммент..." class="flex-1 bg-[#121212] border border-white/20 rounded-lg px-2.5 py-1.5 text-xs text-white">
                                    <button onclick="addComment('${postId}')" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs">Отправить</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                postsList.innerHTML = html;
            });
        }

        window.toggleLike = async function(postId, isLiked) {
            const postRef = doc(db, "posts", postId);
            await updateDoc(postRef, {
                likes: isLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
            });
        };

        window.toggleComments = function(postId) {
            const section = document.getElementById(`comments-section-${postId}`);
            if (section) section.classList.toggle('hidden');
        };

        window.addComment = async function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const postRef = doc(db, "posts", postId);
            const newComment = {
                author: currentUser.displayName,
                text: text,
                createdAt: Date.now()
            };

            await updateDoc(postRef, {
                comments: arrayUnion(newComment)
            });
            input.value = "";
        };

        window.sharePost = function(text) {
            if (navigator.share) {
                navigator.share({ title: 'bibmeme', text: decodeURIComponent(text), url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Ссылка на пост скопирована!");
            }
        };
    </script>
</body>
</html>
