<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет</title>
    <!-- Google Client ID для авторизации -->
    <meta name="google-signin-client_id" content="754087180561-rvtiaemjn16g4s800emdfkmaskp49j64.apps.googleusercontent.com">
    
    <!-- Подключаем шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-[#121212] text-white h-screen flex flex-col justify-between p-6 select-none">

    <!-- Заголовок -->
    <div id="main-content" class="flex flex-col items-center mt-20">
        <h1 class="text-5xl font-extrabold tracking-tight">Привет</h1>
        <p class="text-gray-400 text-lg mt-2 font-medium">Добро пожаловать в соцсеть</p>
    </div>

    <!-- Блок с табличкой и кнопкой Google -->
    <div id="auth-container" class="w-full max-w-sm mx-auto mb-12 flex flex-col gap-3">
        
        <!-- Табличка -->
        <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-4 text-center shadow-lg w-full flex items-center justify-center gap-3">
            <!-- Индикатор -->
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
            </span>

            <!-- Иконка -->
            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2,2 0 114 0v1a1,1 0 001 1h3a1,1 0 011 1v3a1,1 0 01-1 1h-1a2,2 0 100 4h1a1,1 0 011 1v3a1,1 0 01-1 1h-3a1,1 0 01-1-1v-1a2,2 0 10-4 0v1a1,1 0 01-1 1H7a1,1 0 01-1-1v-3a1,1 0 00-1-1H4a2,2 0 110-4h1a1,1 0 001-1V7a1,1 0 011-1h3a1,1 0 001-1V4z"></path>
            </svg>

            <span class="text-lg font-bold text-white tracking-wide">
                Проект делается!
            </span>
        </div>

        <!-- Кнопка Войти через Google -->
        <button onclick="loginWithGoogle()" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 rounded-2xl text-base transition flex items-center justify-center gap-3 shadow-md">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.87z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.24 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.14 0 9.99 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Войти через Google
        </button>

    </div>

    <!-- Инициализация Firebase и логика проверки возраста -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:30b65e2900685b66817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Запрашиваем год рождения после успешного входа
                showAgePrompt(user.displayName);
            } catch (error) {
                console.error("Ошибка входа:", error);
                alert("Не удалось войти через Google: " + error.message);
            }
        };

        function showAgePrompt(userName) {
            const container = document.getElementById('auth-container');
            const mainContent = document.getElementById('main-content');

            mainContent.innerHTML = `
                <h1 class="text-3xl font-extrabold tracking-tight">Привет, ${userName}!</h1>
                <p class="text-gray-400 text-base mt-2 font-medium">Введите ваш год рождения для проверки возраста</p>
            `;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col gap-4">
                    <input type="number" id="birthYearInput" placeholder="Например: 2015" min="1900" max="2026" 
                        class="w-full bg-[#121212] border border-white/20 rounded-xl px-4 py-3 text-white text-center text-lg focus:outline-none focus:border-white">
                    <button onclick="checkAge()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-base hover:bg-gray-200 transition">
                        Подтвердить
                    </button>
                    <p id="errorMsg" class="text-red-400 text-sm font-medium hidden"></p>
                </div>
            `;
        }

        window.checkAge = function() {
            const yearInput = document.getElementById('birthYearInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const currentYear = new Date().getFullYear();
            const birthYear = parseInt(yearInput);

            if (!birthYear || birthYear < 1900 || birthYear > currentYear) {
                errorMsg.textContent = "Пожалуйста, введите корректный год!";
                errorMsg.classList.remove('hidden');
                return;
            }

            const age = currentYear - birthYear;

            if (age < 9) {
                errorMsg.textContent = `Ошибка: Вам ${age} лет. Регистрация разрешена только с 9 лет!`;
                errorMsg.classList.remove('hidden');
                return;
            }

            let category = "";
            if (age >= 9 && age <= 12) {
                category = "Предподросток";
            } else if (age >= 13 && age <= 17) {
                category = "Подросток";
            } else {
                category = "Взрослый";
            }

            const container = document.getElementById('auth-container');
            const mainContent = document.getElementById('main-content');

            mainContent.innerHTML = `
                <h1 class="text-4xl font-extrabold tracking-tight">Добро пожаловать!</h1>
                <p class="text-gray-400 text-lg mt-2 font-medium">Ваша категория: <span class="text-white font-bold">${category}</span> (${age} лет)</p>
            `;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full">
                    <span class="text-green-400 font-bold text-lg">Доступ разрешён 🎉</span>
                </div>
            `;
        }
    </script>

</body>
</html>
