<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bibmeme</title>
    <!-- Google Client ID для авторизации -->
    <meta name="google-signin-client_id" content="754087180561-rvtiaemjn16g4s800emdfkmaskp49j64.apps.googleusercontent.com">
    
    <!-- Подключаем шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-[#121212] text-white h-screen flex flex-col justify-between p-6 select-none">

    <!-- Заголовок -->
    <div id="main-content" class="flex flex-col items-center mt-10">
        <h1 class="text-5xl font-extrabold tracking-tight">bibmeme</h1>
        <p class="text-gray-400 text-lg mt-2 font-medium">Добро пожаловать в соцсеть</p>
    </div>

    <!-- Блок авторизации / контента -->
    <div id="auth-container" class="w-full max-w-sm mx-auto mb-6 flex flex-col gap-3">
        
        <!-- Табличка "Проект делается!" -->
        <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-4 text-center shadow-lg w-full flex items-center justify-center gap-3">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
            </span>

            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2,2 0 114 0v1a1,1 0 001 1h3a1,1 0 011 1v3a1,1 0 01-1 1h-1a2,2 0 100 4h1a1,1 0 011 1v3a1,1 0 01-1 1h-3a1,1 0 01-1-1v-1a2,2 0 10-4 0v1a1,1 0 01-1 1H7a1,1 0 01-1-1v-3a1,1 0 00-1-1H4a2,2 0 110-4h1a1,1 0 001-1V7a1,1 0 011-1h3a1,1 0 001-1V4z"></path>
            </svg>

            <span class="text-lg font-bold text-white tracking-wide">
                Проект делается!
            </span>
        </div>

        <!-- Кнопка Войти через Google -->
        <button onclick="loginWithGoogle()" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 rounded-2xl text-base transition flex items-center justify-center gap-3 shadow-md">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.87z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.24 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.14 0 9.99 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Войти через Google
        </button>

    </div>

    <!-- Firebase и логика авторизации -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, deleteUser, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:30b65e2900685b66817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let currentUser = null;

        function isAppleDevice() {
            const ua = navigator.userAgent;
            if (/Android/i.test(ua)) return false;
            return /iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(ua);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const savedBirthday = localStorage.getItem(`user_birthday_${user.uid}`);
                if (savedBirthday) {
                    const data = JSON.parse(savedBirthday);
                    renderProfile(user.displayName, user.email, data.fullBirthday, data.age, data.ageCategory);
                } else {
                    showBirthdayPrompt(user.displayName);
                }
            }
        });

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                currentUser = result.user;
                
                const savedBirthday = localStorage.getItem(`user_birthday_${currentUser.uid}`);
                if (savedBirthday) {
                    const data = JSON.parse(savedBirthday);
                    renderProfile(currentUser.displayName, currentUser.email, data.fullBirthday, data.age, data.ageCategory);
                } else {
                    showBirthdayPrompt(currentUser.displayName);
                }
            } catch (error) {
                console.error("Ошибка входа:", error);
                alert("Не удалось войти через Google: " + error.message);
            }
        };

        function showBirthdayPrompt(userName) {
            const container = document.getElementById('auth-container');
            const mainContent = document.getElementById('main-content');

            const badge = isAppleDevice() ? ' ' : '';

            mainContent.innerHTML = `
                <h1 class="text-3xl font-extrabold tracking-tight">Привет, ${userName}${badge}!</h1>
                <p class="text-gray-400 text-base mt-2 font-medium">Укажите дату рождения (день, месяц, год)</p>
            `;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col gap-3">
                    <div class="flex gap-2">
                        <input type="number" id="birthDay" placeholder="День" min="1" max="31" 
                            class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                        <input type="number" id="birthMonth" placeholder="Месяц" min="1" max="12" 
                            class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                        <input type="number" id="birthYear" placeholder="Год" min="1900" max="2026" 
                            class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                    </div>
                    <button onclick="submitBirthday()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-base hover:bg-gray-200 transition">
                        Продолжить
                    </button>
                    <p id="errorMsg" class="text-red-400 text-sm font-medium hidden"></p>
                </div>
            `;
        }

        window.submitBirthday = function() {
            const day = parseInt(document.getElementById('birthDay').value);
            const month = parseInt(document.getElementById('birthMonth').value);
            const year = parseInt(document.getElementById('birthYear').value);
            const errorMsg = document.getElementById('errorMsg');

            if (!day || !month || !year || day < 1 || day > 31 || month < 1 || month > 12 || year < 1900 || year > 2026) {
                errorMsg.textContent = "Введите корректную дату рождения!";
                errorMsg.classList.remove('hidden');
                return;
            }

            const today = new Date();
            let age = today.getFullYear() - year;
            const m = today.getMonth() + 1 - month;
            if (m < 0 || (m === 0 && today.getDate() < day)) {
                age--;
            }

            if (age < 9) {
                errorMsg.textContent = `Вам ${age} лет. Регистрация запрещена (только с 9 лет)!`;
                errorMsg.classList.remove('hidden');
                return;
            }

            let ageCategory = "";
            if (age >= 9 && age <= 12) {
                ageCategory = "Предподросток";
            } else if (age >= 13 && age <= 17) {
                ageCategory = "Подросток";
            } else {
                ageCategory = "Взрослый";
            }

            const formattedDay = day < 10 ? '0' + day : day;
            const formattedMonth = month < 10 ? '0' + month : month;
            const fullBirthday = `${formattedDay}.${formattedMonth}.${year}`;

            localStorage.setItem(`user_birthday_${currentUser.uid}`, JSON.stringify({
                fullBirthday,
                age,
                ageCategory
            }));

            renderProfile(currentUser.displayName, currentUser.email, fullBirthday, age, ageCategory);
        };

        function renderProfile(userName, email, fullBirthday, age, ageCategory) {
            const container = document.getElementById('auth-container');
            const mainContent = document.getElementById('main-content');

            const badge = isAppleDevice() ? ' ' : '';

            mainContent.innerHTML = `
                <h1 class="text-4xl font-extrabold tracking-tight">Добро пожаловать!</h1>
                <p class="text-gray-400 text-base mt-2 font-medium">${userName}${badge}</p>
            `;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-left shadow-lg w-full flex flex-col gap-3">
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <span class="text-gray-400 text-sm">Дата рождения:</span>
                        <span class="text-white font-bold">${fullBirthday} (${age} лет)</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <span class="text-gray-400 text-sm">Статус:</span>
                        <span class="text-white font-bold">${ageCategory}</span>
                    </div>
                    
                    <!-- Кнопка Выйти из аккаунта -->
                    <button onclick="logout()" class="w-full mt-2 border border-white/20 bg-white/5 text-white hover:bg-white/10 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Выйти из аккаунта
                    </button>

                    <!-- Кнопка Удалить аккаунт -->
                    <button onclick="showDeleteWarning()" class="w-full border border-red-500/40 bg-red-500/10 text-red-400 hover:bg-red-500/20 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                        Удалить аккаунт
                    </button>
                </div>
            `;
        }

        window.showDeleteWarning = function() {
            const container = document.getElementById('auth-container');
            const mainContent = document.getElementById('main-content');

            mainContent.innerHTML = `
                <h1 class="text-2xl font-extrabold tracking-tight text-red-400">Удаление аккаунта</h1>
                <p class="text-gray-400 text-sm mt-1 text-center font-medium">Это действие необратимо</p>
            `;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-red-500/30 rounded-2xl p-5 text-left shadow-lg w-full flex flex-col gap-3">
                    <p class="text-sm text-gray-200 leading-relaxed">
                        <strong class="text-white">Пока вы еще не ушли, прочитайте, это очень важно:</strong><br><br>
                        Вы собираетесь удалить аккаунт в Bibmeme. После удаления вы не можете восстановить аккаунт, фотки, посты, сообщения, комментарии и друзей.<br><br>
                        Вы можете скачать данные перед удалением аккаунта.<br><br>
                        Если вы действительно хотите удалить аккаунт, согласитесь на удаление и то, что вы скачали данные.<br><br>
                        После нажатия кнопки «Удалить аккаунт» все данные и аккаунт сотрутся безвозвратно.
                    </p>

                    <!-- Кнопка скачивания данных -->
                    <button onclick="downloadUserData()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Скачать данные
                    </button>

                    <!-- Чекбоксы согласия -->
                    <div class="flex flex-col gap-2 mt-2">
                        <label class="flex items-start gap-2 text-xs text-gray-300 cursor-pointer">
                            <input type="checkbox" id="checkDownloaded" onchange="toggleDeleteBtn()" class="mt-0.5 rounded bg-[#121212] border-white/20 text-red-500 focus:ring-0">
                            <span>Я скачал(а) свои данные перед удалением</span>
                        </label>
                        <label class="flex items-start gap-2 text-xs text-gray-300 cursor-pointer">
                            <input type="checkbox" id="checkAgree" onchange="toggleDeleteBtn()" class="mt-0.5 rounded bg-[#121212] border-white/20 text-red-500 focus:ring-0">
                            <span>Я согласен(на) на удаление аккаунта и понимаю, что всё сотрется безвозвратно</span>
                        </label>
                    </div>

                    <!-- Кнопка финального удаления (изначально неактивна/полупрозрачна) -->
                    <button id="finalDeleteBtn" onclick="executeAccountDeletion()" disabled class="w-full bg-red-500/40 text-white/50 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 cursor-not-allowed">
                        Удалить аккаунт навсегда
                    </button>

                    <!-- Кнопка отмены -->
                    <button onclick="cancelDeletion()" class="w-full bg-transparent hover:bg-white/5 text-gray-400 font-bold py-2 rounded-xl text-xs transition">
                        Отмена, вернуться назад
                    </button>
                </div>
            `;
        }

        window.toggleDeleteBtn = function() {
            const check1 = document.getElementById('checkDownloaded').checked;
            const check2 = document.getElementById('checkAgree').checked;
            const btn = document.getElementById('finalDeleteBtn');

            if (check1 && check2) {
                btn.disabled = false;
                btn.classList.remove('bg-red-500/40', 'text-white/50', 'cursor-not-allowed');
                btn.classList.add('bg-red-600', 'hover:bg-red-500', 'text-white');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-red-500/40', 'text-white/50', 'cursor-not-allowed');
                btn.classList.remove('bg-red-600', 'hover:bg-red-500', 'text-white');
            }
        };

        window.downloadUserData = function() {
            const savedBirthday = localStorage.getItem(`user_birthday_${currentUser.uid}`) || "{}";
            const dataToExport = {
                uid: currentUser.uid,
                name: currentUser.displayName,
                email: currentUser.email,
                profileData: JSON.parse(savedBirthday),
                exportDate: new Date().toISOString()
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `bibmeme_data_${currentUser.uid}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        window.executeAccountDeletion = async function() {
            if (!confirm("Вы уверены, что хотите окончательно удалить аккаунт в Bibmeme?")) return;
            
            try {
                // Удаляем локальные данные
                localStorage.removeItem(`user_birthday_${currentUser.uid}`);
                
                // Удаляем аккаунт из Firebase Auth
                await deleteUser(currentUser);
                alert("Аккаунт успешно удален.");
                location.reload();
            } catch (error) {
                console.error("Ошибка при удалении аккаунта:", error);
                alert("Не удалось удалить аккаунт. Возможно, требуется повторный вход (перезайдите в аккаунт и попробуйте снова).");
            }
        };

        window.cancelDeletion = function() {
            const savedBirthday = localStorage.getItem(`user_birthday_${currentUser.uid}`);
            if (savedBirthday && currentUser) {
                const data = JSON.parse(savedBirthday);
                renderProfile(currentUser.displayName, currentUser.email, data.fullBirthday, data.age, data.ageCategory);
            } else {
                location.reload();
            }
        };

        window.logout = async function() {
            try {
                await signOut(auth);
                location.reload();
            } catch (error) {
                console.error("Ошибка при выходе:", error);
            }
        };
    </script>

</body>
</html>
