<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bibmeme</title>
    <!-- Google Client ID для авторизации -->
    <meta name="google-signin-client_id" content="754087180561-rvtiaemjn16g4s800emdfkmaskp49j64.apps.googleusercontent.com">
    
    <!-- Подключаем шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-[#121212] text-white h-screen flex flex-col justify-between p-6 select-none">

    <!-- Заголовок -->
    <div id="main-content" class="flex flex-col items-center mt-20">
        <h1 class="text-5xl font-extrabold tracking-tight">bibmeme</h1>
        <p class="text-gray-400 text-lg mt-2 font-medium">Добро пожаловать в соцсеть</p>
    </div>

    <!-- Блок авторизации -->
    <div id="auth-container" class="w-full max-w-sm mx-auto mb-12 flex flex-col gap-3">
        
        <!-- Табличка "Проект делается!" -->
        <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-4 text-center shadow-lg w-full flex items-center justify-center gap-3">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
            </span>

            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2,2 0 114 0v1a1,1 0 001 1h3a1,1 0 011 1v3a1,1 0 01-1 1h-1a2,2 0 100 4h1a1,1 0 011 1v3a1,1 0 01-1 1h-3a1,1 0 01-1-1v-1a2,2 0 10-4 0v1a1,1 0 01-1 1H7a1,1 0 01-1-1v-3a1,1 0 00-1-1H4a2,2 0 110-4h1a1,1 0 001-1V7a1,1 0 011-1h3a1,1 0 001-1V4z"></path>
            </svg>

            <span class="text-lg font-bold text-white tracking-wide">
                Проект делается!
            </span>
        </div>

        <!-- Кнопка Войти через Google -->
        <button onclick="loginWithGoogle()" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 rounded-2xl text-base transition flex items-center justify-center gap-3 shadow-md">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.87z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.24 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.14 0 9.99 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Войти через Google
        </button>

    </div>

    <!-- Firebase и логика авторизации -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:30b65e2900685b66817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let currentUser = null;

        // SVG-иконка Apple, которая гарантированно отобразится на любом Android и ПК
        const appleIconSvg = `<svg class="inline-block w-5 h-5 ml-1 mb-1 fill-current text-white" viewBox="0 0 170 170"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.04-2.55-6.91-7.18-11.61-13.88-9.03-12.75-15.93-26.75-20.7-42-4.77-15.25-7.15-29.83-7.15-43.74 0-16.1 4.16-29.13 12.49-39.09 8.32-9.95 18.66-14.97 31.03-15.05 4.78 0 10.19 1.18 16.24 3.55 6.05 2.37 10.15 3.55 12.3 3.55 2.03 0 6.13-1.18 12.3-3.55 6.17-2.37 11.45-3.52 15.85-3.44 14.74.43 26.35 5.76 34.83 15.98-13.04 7.9-19.4 19.33-19.08 34.29.32 12.4 5.17 22.42 14.55 30.07 4.9 4.02 10.74 6.85 17.51 8.5-3.64 10.85-8.36 21.32-14.16 31.41zM119.22 31.95c0-7.79 2.76-15.03 8.29-21.72 5.53-6.69 12.38-10.42 20.55-11.19.11 1.08.16 2.06.16 2.93 0 7.6-2.9 14.89-8.71 21.87-5.81 6.98-12.78 10.75-20.91 11.31-.22-1.08-.38-2.18-.38-3.2z"/></svg>`;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const savedBirthday = localStorage.getItem(`user_birthday_${user.uid}`);
                if (savedBirthday) {
                    const data = JSON.parse(savedBirthday);
                    renderProfile(user.displayName, data.fullBirthday, data.age, data.ageCategory);
                } else {
                    showBirthdayPrompt(user.displayName);
                }
            }
        });

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                currentUser = result.user;
                
                const savedBirthday = localStorage.getItem(`user_birthday_${currentUser.uid}`);
                if (savedBirthday) {
                    const data = JSON.parse(savedBirthday);
                    renderProfile(currentUser.displayName, data.fullBirthday, data.age, data.ageCategory);
                } else {
                    showBirthdayPrompt(currentUser.displayName);
                }
            } catch (error) {
                console.error("Ошибка входа:", error);
                alert("Не удалось войти через Google: " + error.message);
            }
        };

        function showBirthdayPrompt(userName) {
            const container = document.getElementById('auth-container');
            const mainContent = document.getElementById('main-content');

            mainContent.innerHTML = `
                <h1 class="text-3xl font-extrabold tracking-tight">Привет, ${userName} ${appleIconSvg}!</h1>
                <p class="text-gray-400 text-base mt-2 font-medium">Укажите дату рождения (день, месяц, год)</p>
            `;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col gap-3">
                    <div class="flex gap-2">
                        <input type="number" id="birthDay" placeholder="День" min="1" max="31" 
                            class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                        <input type="number" id="birthMonth" placeholder="Месяц" min="1" max="12" 
                            class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                        <input type="number" id="birthYear" placeholder="Год" min="1900" max="2026" 
                            class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                    </div>
                    <button onclick="submitBirthday()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-base hover:bg-gray-200 transition">
                        Продолжить
                    </button>
                    <p id="errorMsg" class="text-red-400 text-sm font-medium hidden"></p>
                </div>
            `;
        }

        window.submitBirthday = function() {
            const day = parseInt(document.getElementById('birthDay').value);
            const month = parseInt(document.getElementById('birthMonth').value);
            const year = parseInt(document.getElementById('birthYear').value);
            const errorMsg = document.getElementById('errorMsg');

            if (!day || !month || !year || day < 1 || day > 31 || month < 1 || month > 12 || year < 1900 || year > 2026) {
                errorMsg.textContent = "Введите корректную дату рождения!";
                errorMsg.classList.remove('hidden');
                return;
            }

            const today = new Date();
            let age = today.getFullYear() - year;
            const m = today.getMonth() + 1 - month;
            if (m < 0 || (m === 0 && today.getDate() < day)) {
                age--;
            }

            if (age < 9) {
                errorMsg.textContent = `Вам ${age} лет. Регистрация запрещена (только с 9 лет)!`;
                errorMsg.classList.remove('hidden');
                return;
            }

            let ageCategory = "";
            if (age >= 9 && age <= 12) {
                ageCategory = "Предподросток";
            } else if (age >= 13 && age <= 17) {
                ageCategory = "Подросток";
            } else {
                ageCategory = "Взрослый";
            }

            const formattedDay = day < 10 ? '0' + day : day;
            const formattedMonth = month < 10 ? '0' + month : month;
            const fullBirthday = `${formattedDay}.${formattedMonth}.${year}`;

            localStorage.setItem(`user_birthday_${currentUser.uid}`, JSON.stringify({
                fullBirthday,
                age,
                ageCategory
            }));

            renderProfile(currentUser.displayName, fullBirthday, age, ageCategory);
        };

        function renderProfile(userName, fullBirthday, age, ageCategory) {
            const container = document.getElementById('auth-container');
            const mainContent = document.getElementById('main-content');

            mainContent.innerHTML = `
                <h1 class="text-4xl font-extrabold tracking-tight">Добро пожаловать!</h1>
                <p class="text-gray-400 text-base mt-2 font-medium">${userName} ${appleIconSvg}</p>
            `;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-left shadow-lg w-full flex flex-col gap-3">
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <span class="text-gray-400 text-sm">Дата рождения:</span>
                        <span class="text-white font-bold">${fullBirthday} (${age} лет)</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <span class="text-gray-400 text-sm">Статус:</span>
                        <span class="text-white font-bold">${ageCategory}</span>
                    </div>
                    
                    <!-- Кнопка Выйти из аккаунта -->
                    <button onclick="logout()" class="w-full mt-2 border border-red-500/40 bg-red-500/10 text-red-400 hover:bg-red-500/20 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Выйти из аккаунта
                    </button>
                </div>
            `;
        }

        window.logout = async function() {
            try {
                await signOut(auth);
                location.reload();
            } catch (error) {
                console.error("Ошибка при выходе:", error);
            }
        };
    </script>

</body>
</html>
