<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bibmeme</title>
    <meta name="google-signin-client_id" content="754087180561-rvtiaemjn16g4s800emdfkmaskp49j64.apps.googleusercontent.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: white;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between p-4 select-none pt-10 overflow-x-hidden">

    <!-- Верхний заголовок -->
    <div id="top-header" class="flex flex-col items-center w-full mb-4 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">bibmeme</h1>
    </div>

    <!-- Основной контейнер экрана -->
    <div id="app-container" class="w-full max-w-sm mx-auto my-auto flex flex-col gap-3">
        
        <!-- Стартовый экран (Приветствие + Вход через Google) -->
        <div id="welcome-screen" class="w-full flex flex-col gap-3">
            <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-4 text-center shadow-lg w-full flex items-center justify-center gap-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
                </span>
                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2,2 0 114 0v1a1,1 0 001 1h3a1,1 0 011 1v3a1,1 0 011 1h-1a2,2 0 100 4h1a1,1 0 011 1v3a1,1 0 01-1 1h-3a1,1 0 01-1-1v-1a2,2 0 10-4 0v1a1,1 0 01-1 1H7a1,1 0 01-1-1v-3a1,1 0 00-1-1H4a2,2 0 110-4h1a1,1 0 001-1V7a1,1 0 011-1h3a1,1 0 001-1V4z"></path></svg>
                <span class="text-lg font-bold text-white tracking-wide">Проект делается!</span>
            </div>

            <button onclick="loginWithGoogle()" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 rounded-2xl text-base transition flex items-center justify-center gap-3 shadow-md">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.87z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.24 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.14 0 9.99 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                Войти через Google
            </button>
            <p id="accountLimitError" class="text-red-400 text-xs text-center font-medium hidden"></p>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <div id="bottom-nav" class="hidden w-full max-w-sm mx-auto bg-[#1e1e1e] border border-white/10 rounded-2xl p-1.5 flex justify-around items-center shadow-lg mt-auto">
        <button onclick="switchTab('servers')" id="nav-servers" class="flex-1 py-2 text-center font-bold text-xs text-gray-400 hover:text-white transition rounded-xl">Сервера</button>
        <button onclick="switchTab('feed')" id="nav-feed" class="flex-1 py-2 text-center font-bold text-xs text-gray-400 hover:text-white transition rounded-xl">Лента</button>
        <button onclick="switchTab('adminServer')" id="nav-adminServer" class="hidden flex-1 py-2 text-center font-bold text-xs text-purple-400 hover:text-purple-300 transition rounded-xl">👑 Сервер</button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex-1 py-2 text-center font-bold text-xs text-white bg-white/10 transition rounded-xl">Профиль</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:30b65e2900685b66817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeTab = 'profile';

        const OWNER_UIDS = ["X03NzVf3xPQLajxDwV1xNIf4nU42"];
        const ADMIN_UIDS = ["q4GyUEltlrS9KaSMoGYdbE4dkK13"];

        function getUserRole() {
            if (!currentUser || !currentUser.uid) return "user";
            if (OWNER_UIDS.includes(currentUser.uid)) return "owner";
            if (ADMIN_UIDS.includes(currentUser.uid)) return "admin";
            return "user";
        }

        function isAppleDevice() {
            const ua = navigator.userAgent;
            if (/Android/i.test(ua)) return false;
            return /iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(ua);
        }

        function registerDeviceAccount(uid) {
            let accounts = JSON.parse(localStorage.getItem('device_registered_accounts') || '[]');
            if (!accounts.includes(uid)) {
                if (accounts.length >= 3) return false;
                accounts.push(uid);
                localStorage.setItem('device_registered_accounts', JSON.stringify(accounts));
            }
            return true;
        }

        // Обработка результата редиректа Google
        getRedirectResult(auth).then((result) => {
            if (result && result.user) {
                const user = result.user;
                if (!registerDeviceAccount(user.uid)) {
                    signOut(auth);
                    const limitError = document.getElementById('accountLimitError');
                    if (limitError) {
                        limitError.textContent = "На этом устройстве уже создано 3 аккаунта! Доступ ограничен.";
                        limitError.classList.remove('hidden');
                    }
                    return;
                }
                currentUser = user;
                document.getElementById('welcome-screen').classList.add('hidden');
                checkUserSessionState();
            }
        }).catch((error) => {
            console.error("Ошибка редиректа:", error);
            alert("Ошибка входа через Google: " + error.message);
        });

        // Отслеживание состояния сессии
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                
                let accounts = JSON.parse(localStorage.getItem('device_registered_accounts') || '[]');
                if (!accounts.includes(user.uid)) {
                    if (accounts.length >= 3) {
                        signOut(auth);
                        const limitError = document.getElementById('accountLimitError');
                        if (limitError) {
                            limitError.textContent = "На этом устройстве уже создано 3 аккаунта! Доступ ограничен.";
                            limitError.classList.remove('hidden');
                        }
                        return;
                    }
                    accounts.push(user.uid);
                    localStorage.setItem('device_registered_accounts', JSON.stringify(accounts));
                }

                document.getElementById('welcome-screen').classList.add('hidden');
                checkUserSessionState();
            }
        });

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                console.error("Ошибка входа:", error);
                alert("Не удалось запустить вход через Google: " + error.message);
            }
        };

        function checkUserSessionState() {
            const savedData = localStorage.getItem(`user_account_${currentUser.uid}`);
            if (savedData) {
                const data = JSON.parse(savedData);
                if (checkSleepLock(data.age)) return;

                if (data.hasPassword && !sessionStorage.getItem(`auth_verified_${currentUser.uid}`)) {
                    showPasswordLoginPrompt(currentUser.displayName);
                } else {
                    document.getElementById('bottom-nav').classList.remove('hidden');
                    const role = getUserRole();
                    if (role === 'owner' || role === 'admin') {
                        document.getElementById('nav-adminServer').classList.remove('hidden');
                    }
                    switchTab('profile');
                }
            } else {
                showBirthdayPrompt(currentUser.displayName);
            }
        }

        function checkSleepLock(age) {
            if (age >= 18) return false;

            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const totalCurrentMinutes = currentHour * 60 + currentMinute;
            const dateKey = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
            const isExtendedToday = localStorage.getItem(`sleep_ext_${currentUser.uid}_${dateKey}`) === "true";

            let sleepStartMinutes = 0;   
            let extensionLimitMinutes = 0; 
            let ageLabel = "";

            if (age >= 9 && age <= 12) {
                sleepStartMinutes = 22 * 60;       
                extensionLimitMinutes = 23 * 60;   
                ageLabel = "9-12 лет (сон в 22:00)";
            } else if (age >= 13 && age <= 15) {
                sleepStartMinutes = 23 * 60;       
                extensionLimitMinutes = 24 * 60;   
                ageLabel = "13-15 лет (сон в 23:00)";
            } else if (age >= 16 && age <= 17) {
                sleepStartMinutes = 0;             
                extensionLimitMinutes = 1 * 60;    
                ageLabel = "16-17 лет (сон в 00:00)";
            }

            let isLocked = false;
            let canExtend = false;

            if (age >= 16 && age <= 17) {
                if (currentHour >= 0 && currentHour < 6) {
                    isLocked = true;
                    if (totalCurrentMinutes < extensionLimitMinutes && !isExtendedToday) canExtend = true;
                }
            } else {
                if (totalCurrentMinutes >= sleepStartMinutes || currentHour < 6) {
                    isLocked = true;
                    if (totalCurrentMinutes < extensionLimitMinutes && !isExtendedToday) {
                        canExtend = true;
                    } else if (currentHour < 6 && !isExtendedToday && totalCurrentMinutes < (sleepStartMinutes + 60)) {
                        canExtend = true;
                    }
                }
            }

            if (isLocked) {
                showSleepLockScreen(ageLabel, canExtend);
                return true;
            }
            return false;
        }

        function showSleepLockScreen(ageLabel, canExtend) {
            document.getElementById('bottom-nav').classList.add('hidden');
            const container = document.getElementById('app-container');
            const topHeader = document.getElementById('top-header');

            topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight text-indigo-400">Пора спать! 🌙</h1>`;
            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-indigo-500/30 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col items-center gap-4">
                    <div class="text-4xl">😴</div>
                    <p class="text-sm text-gray-200 font-medium">Время отдыха для категории <strong class="text-white">${ageLabel}</strong>. Приложение заблокировано.</p>
                    ${canExtend ? `
                        <button onclick="extendSleepTime()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition">Отложить на 1 час</button>
                    ` : `<p class="text-xs text-red-400 font-semibold">Лимит отсрочки исчерпан. Спокойной ночи!</p>`}
                </div>
            `;
        }

        window.extendSleepTime = function() {
            const now = new Date();
            const dateKey = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
            localStorage.setItem(`sleep_ext_${currentUser.uid}_${dateKey}`, "true");
            location.reload();
        };

        function showPasswordLoginPrompt(userName) {
            document.getElementById('bottom-nav').classList.add('hidden');
            const container = document.getElementById('app-container');
            const topHeader = document.getElementById('top-header');
            topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Вход, ${userName}</h1>`;
            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col gap-3">
                    <p class="text-sm text-gray-300">Для этого аккаунта установлен пароль. Введите его:</p>
                    <input type="password" id="loginPassword" placeholder="Ваш пароль" class="w-full bg-[#121212] border border-white/20 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-white">
                    <button onclick="verifyLoginPassword()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-base hover:bg-gray-200 transition">Войти</button>
                    <p id="loginErrorMsg" class="text-red-400 text-sm font-medium hidden"></p>
                </div>
            `;
        }

        window.verifyLoginPassword = function() {
            const enteredPass = document.getElementById('loginPassword').value;
            const savedData = JSON.parse(localStorage.getItem(`user_account_${currentUser.uid}`));
            const errorMsg = document.getElementById('loginErrorMsg');

            if (enteredPass === savedData.password) {
                sessionStorage.setItem(`auth_verified_${currentUser.uid}`, "true");
                document.getElementById('bottom-nav').classList.remove('hidden');
                const role = getUserRole();
                if (role === 'owner' || role === 'admin') document.getElementById('nav-adminServer').classList.remove('hidden');
                switchTab('profile');
            } else {
                errorMsg.textContent = "Неверный пароль!";
                errorMsg.classList.remove('hidden');
            }
        };

        function showBirthdayPrompt(userName) {
            document.getElementById('bottom-nav').classList.add('hidden');
            const topHeader = document.getElementById('top-header');
            const container = document.getElementById('app-container');
            const badge = isAppleDevice() ? ' ' : '';

            topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Привет, ${userName}${badge}!</h1><p class="text-gray-400 text-xs mt-1 font-medium">Укажите дату рождения</p>`;
            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full flex flex-col gap-3">
                    <div class="flex gap-2">
                        <input type="number" id="birthDay" placeholder="День" min="1" max="31" class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                        <input type="number" id="birthMonth" placeholder="Месяц" min="1" max="12" class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                        <input type="number" id="birthYear" placeholder="Год" min="1900" max="2026" class="w-1/3 bg-[#121212] border border-white/20 rounded-xl px-3 py-3 text-white text-center text-sm focus:outline-none focus:border-white">
                    </div>
                    <button onclick="proceedToPassword()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-base hover:bg-gray-200 transition">Продолжить</button>
                    <p id="errorMsg" class="text-red-400 text-sm font-medium hidden"></p>
                </div>
            `;
        }

        let tempBirthdayData = null;

        window.proceedToPassword = function() {
            const day = parseInt(document.getElementById('birthDay').value);
            const month = parseInt(document.getElementById('birthMonth').value);
            const year = parseInt(document.getElementById('birthYear').value);
            const errorMsg = document.getElementById('errorMsg');

            if (!day || !month || !year || day < 1 || day > 31 || month < 1 || month > 12 || year < 1900 || year > 2026) {
                errorMsg.textContent = "Введите корректную дату рождения!";
                errorMsg.classList.remove('hidden');
                return;
            }

            const today = new Date();
            let age = today.getFullYear() - year;
            const m = today.getMonth() + 1 - month;
            if (m < 0 || (m === 0 && today.getDate() < day)) age--;

            if (age < 9) {
                errorMsg.textContent = `Вам ${age} лет. Регистрация запрещена (только с 9 лет)!`;
                errorMsg.classList.remove('hidden');
                return;
            }

            let ageCategory = "";
            if (age >= 9 && age <= 12) ageCategory = "Предподросток (9-12)";
            else if (age >= 13 && age <= 15) ageCategory = "Подросток (13-15)";
            else if (age >= 16 && age <= 17) ageCategory = "Старший подросток (16-17)";
            else ageCategory = "Взрослый (18+)";

            tempBirthdayData = {
                fullBirthday: `${day < 10 ? '0'+day : day}.${month < 10 ? '0'+month : month}.${year}`,
                age,
                ageCategory
            };

            showPasswordCreationPrompt();
        };

            function showPasswordCreationPrompt() {
        const topHeader = document.getElementById('top-header');
        const container = document.getElementById('app-container');
        topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Защита аккаунта</h1><p class="text-gray-400 text-xs mt-1 font-medium">Создайте пароль или пропустите</p>`;
        container.innerHTML = `
            <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-5 text-left shadow-lg w-full flex flex-col gap-3">
                <p class="text-xs text-gray-300 leading-relaxed">Требования к паролю:<br>• От 6 символов<br>• Мин. 2 цифры<br>• Нижнее подчеркивание (_) и спецсимвол (!@#$%^&*)<br>• Мин. 1 заглавная буква</p>
                <input type="password" id="newPassword" placeholder="Придумайте пароль" class="w-full bg-[#121212] border border-white/20 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-white">
                <button onclick="saveAccountWithPassword(true)" class="w-full bg-white text-black font-bold py-3 rounded-xl text-sm hover:bg-gray-200 transition">Сохранить с паролем</button>
                <button onclick="saveAccountWithPassword(false)" class="w-full bg-transparent border border-white/20 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-white/5 transition">Пропустить</button>
                <p id="passErrorMsg" class="text-red-400 text-xs font-medium hidden"></p>
            </div>
        `;
    }

    window.saveAccountWithPassword = function(withPassword) {
        let password = "";
        if (withPassword) {
            password = document.getElementById('newPassword').value;
            const passErrorMsg = document.getElementById('passErrorMsg');
            const hasLength = password.length >= 6;
            const hasDigits = (password.match(/\d/g) || []).length >= 2;
            const hasSpecial = password.includes('_') && /[!@#$%^&*]/.test(password);
            const hasUpper = /[A-ZА-Я]/.test(password);

            if (!hasLength || !hasDigits || !hasSpecial || !hasUpper) {
                passErrorMsg.textContent = "Пароль не соответствует требованиям безопасности!";
                passErrorMsg.classList.remove('hidden');
                return;
            }
        }

        const accountData = { ...tempBirthdayData, hasPassword: withPassword, password: password, createdAt: new Date().toISOString() };
        localStorage.setItem(`user_account_${currentUser.uid}`, JSON.stringify(accountData));
        document.getElementById('bottom-nav').classList.remove('hidden');
        const role = getUserRole();
        if (role === 'owner' || role === 'admin') document.getElementById('nav-adminServer').classList.remove('hidden');
        switchTab('profile');
    };

    window.switchTab = function(tabName) {
        activeTab = tabName;
        const container = document.getElementById('app-container');
        const topHeader = document.getElementById('top-header');

        document.querySelectorAll('#bottom-nav button').forEach(btn => {
            btn.classList.remove('bg-white/10', 'text-white');
            btn.classList.add('text-gray-400');
        });
        const activeBtn = document.getElementById(`nav-${tabName}`);
        if (activeBtn) {
            activeBtn.classList.add('bg-white/10', 'text-white');
            activeBtn.classList.remove('text-gray-400');
        }

        if (tabName === 'profile') {
            topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Профиль</h1>`;
            const data = JSON.parse(localStorage.getItem(`user_account_${currentUser.uid}`) || '{}');
            const role = getUserRole();
            let roleBadge = `<span class="bg-gray-800 text-gray-300 text-xs px-2.5 py-1 rounded-full font-medium">Участник</span>`;
            if (role === 'owner') roleBadge = `<span class="bg-red-600/30 text-red-400 border border-red-500/30 text-xs px-2.5 py-1 rounded-full font-bold">👑 Владелец</span>`;
            if (role === 'admin') roleBadge = `<span class="bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 text-xs px-2.5 py-1 rounded-full font-bold">🛡️ Админ</span>`;

            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-5 shadow-lg w-full flex flex-col gap-4">
                    <div class="flex items-center gap-4">
                        <img src="${currentUser.photoURL || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-full border border-white/20 object-cover">
                        <div>
                            <h2 class="text-lg font-bold">${currentUser.displayName}</h2>
                            <p class="text-xs text-gray-400">${currentUser.email}</p>
                            <div class="mt-1.5">${roleBadge}</div>
                        </div>
                    </div>
                    <div class="bg-[#121212] rounded-xl p-3 border border-white/10 text-xs space-y-1.5 text-gray-300">
                        <p>🎂 Дата рождения: <span class="text-white font-bold">${data.fullBirthday || 'Не указана'}</span></p>
                        <p>📌 Возраст: <span class="text-white font-bold">${data.age || '--'} лет</span></p>
                        <p>🏷️ Категория: <span class="text-white font-bold">${data.ageCategory || '--'}</span></p>
                        <p>🔒 Пароль: <span class="text-white font-bold">${data.hasPassword ? 'Установлен' : 'Нет'}</span></p>
                    </div>
                    <div class="flex flex-col gap-2 pt-2 border-t border-white/10">
                        <button onclick="togglePasswordManagement()" class="w-full bg-white/10 hover:bg-white/20 text-white font-bold py-2 rounded-xl text-xs transition">⚙️ Управление паролем</button>
                        <div id="passwordManagerBox" class="hidden flex flex-col gap-2 bg-[#121212] p-3 rounded-xl border border-white/10">
                            <input type="password" id="newPassInput" placeholder="Новый пароль" class="w-full bg-[#1e1e1e] border border-white/20 rounded-lg px-3 py-2 text-xs text-white">
                            <button onclick="updatePassword()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs transition">Изменить пароль</button>
                            ${data.hasPassword ? `<button onclick="removePassword()" class="w-full bg-red-600/20 text-red-400 hover:bg-red-600/30 font-bold py-2 rounded-lg text-xs transition">Удалить пароль</button>` : ''}
                        </div>
                        <button onclick="logoutAccount()" class="w-full bg-white/5 hover:bg-white/10 text-gray-300 font-bold py-2.5 rounded-xl text-xs transition">Выйти из аккаунта</button>
                        <button onclick="deleteAccount()" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 font-bold py-2.5 rounded-xl text-xs transition">Удалить аккаунт с устройства</button>
                    </div>
                </div>
            `;
        } else if (tabName === 'feed') {
            topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Лента мемов</h1>`;
            container.innerHTML = `<div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full"><p class="text-sm text-gray-400">Лента пуста. Скоро здесь появятся лучшие мемы!</p></div>`;
        } else if (tabName === 'servers') {
            topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight">Сервера</h1>`;
            container.innerHTML = `<div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center shadow-lg w-full"><p class="text-sm text-gray-400">Список игровых и чат-серверов пуст.</p></div>`;
        } else if (tabName === 'adminServer') {
            topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight text-purple-400">Управление Сервером</h1>`;
            const role = getUserRole();
            container.innerHTML = `
                <div class="bg-[#1e1e1e] border border-purple-500/30 rounded-2xl p-5 shadow-lg w-full flex flex-col gap-4">
                    <div class="flex items-center justify-between"><span class="text-xs text-gray-400">Статус системы:</span><span class="text-xs text-green-400 font-bold">● Онлайн</span></div>
                    <div class="bg-purple-950/30 border border-purple-500/20 rounded-xl p-3 text-xs text-purple-300">🛡️ Права доступа: <strong class="text-white">${role === 'owner' ? '👑 Владелец' : 'Администратор'}</strong></div>
                    ${role === 'owner' ? `<button onclick="alert('Системный кеш успешно сброшен!')" class="w-full bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 font-bold py-2.5 rounded-xl text-xs transition">⚡ Сбросить системные кеши (Owner)</button>` : ''}
                </div>
            `;
        }
    };

    window.togglePasswordManagement = function() {
        const box = document.getElementById('passwordManagerBox');
        if (box) box.classList.toggle('hidden');
    };

    window.updatePassword = function() {
        const newPass = document.getElementById('newPassInput').value;
        const hasLength = newPass.length >= 6;
        const hasDigits = (newPass.match(/\d/g) || []).length >= 2;
        const hasSpecial = newPass.includes('_') && /[!@#$%^&*]/.test(newPass);
        const hasUpper = /[A-ZА-Я]/.test(newPass);

        if (!hasLength || !hasDigits || !hasSpecial || !hasUpper) {
            alert("Пароль не соответствует требованиям безопасности!");
            return;
        }

        let data = JSON.parse(localStorage.getItem(`user_account_${currentUser.uid}`));
        data.hasPassword = true;
        data.password = newPass;
        localStorage.setItem(`user_account_${currentUser.uid}`, JSON.stringify(data));
        alert("Пароль успешно изменен!");
        switchTab('profile');
    };

    window.removePassword = function() {
        if (confirm("Вы уверены, что хотите удалить пароль?")) {
            let data = JSON.parse(localStorage.getItem(`user_account_${currentUser.uid}`));
            data.hasPassword = false;
            data.password = "";
            localStorage.setItem(`user_account_${currentUser.uid}`, JSON.stringify(data));
            alert("Пароль удален!");
            switchTab('profile');
        }
    };

    window.logoutAccount = async function() {
        await signOut(auth);
        location.reload();
    };

    window.deleteAccount = async function() {
        const container = document.getElementById('app-container');
        const topHeader = document.getElementById('top-header');

        topHeader.innerHTML = `<h1 class="text-2xl font-extrabold tracking-tight text-red-500">Удаление аккаунта</h1>`;
        
        container.innerHTML = `
            <div class="bg-[#1e1e1e] border border-red-500/30 rounded-2xl p-5 shadow-lg w-full flex flex-col gap-4 text-xs">
                <p class="font-bold text-white text-sm">Пока вы еще не ушли, прочитайте это, это очень важно:</p>
                <p class="text-gray-300 leading-relaxed">
                    Вы собираетесь удалить аккаунт в bibmeme с данными. После удаления нельзя восстановить аккаунт, фотки, посты, клипы, сообщения, комментарии и лайки. Но можно их загрузить вовремя.
                </p>
                <p class="text-gray-300">
                    Вы соглашаетесь на то, что после нажатия «Удалить аккаунт» ваши данные и аккаунт будут удалены.
                </p>

                <div class="flex flex-col gap-2 pt-2 border-t border-white/10">
                    <label class="flex items-start gap-2 cursor-pointer">
                        <input type="checkbox" id="checkConsent" class="mt-0.5 rounded accent-red-500">
                        <span class="text-gray-200">Я соглашаюсь на удаления данных и аккаунта</span>
                    </label>
                    <label class="flex items-start gap-2 cursor-pointer">
                        <input type="checkbox" id="checkBackup" class="mt-0.5 rounded accent-red-500">
                        <span class="text-gray-200">Я загрузил данные перед удалением</span>
                    </label>
                </div>

                <div class="flex flex-col gap-2 pt-2">
                    <button onclick="downloadUserData()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                        📥 Загрузить данные
                    </button>
                    <button onclick="confirmAndDeleteAccount()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                        Удалить аккаунт
                    </button>
                    <button onclick="switchTab('profile')" class="w-full bg-white/10 hover:bg-white/20 text-white font-bold py-2.5 rounded-xl text-xs transition">
                        Отмена
                    </button>
                </div>
            </div>
        `;
    };

    window.downloadUserData = function() {
        const data = localStorage.getItem(`user_account_${currentUser.uid}`);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bibmeme_backup_${currentUser.uid}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    window.confirmAndDeleteAccount = async function() {
        const consentChecked = document.getElementById('checkConsent').checked;
        const backupChecked = document.getElementById('checkBackup').checked;

        if (!consentChecked || !backupChecked) {
            alert("Пожалуйста, поставьте обе галочки для подтверждения удаления!");
            return;
        }

        if (confirm("Вы точно уверены? Действие необратимо!")) {
            localStorage.removeItem(`user_account_${currentUser.uid}`);
            let accounts = JSON.parse(localStorage.getItem('device_registered_accounts') || '[]');
            accounts = accounts.filter(id => id !== currentUser.uid);
            localStorage.setItem('device_registered_accounts', JSON.stringify(accounts));
            await signOut(auth);
            location.reload();
        }
    };
</script>
</body>
</html>
