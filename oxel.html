<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxel — Помощник Bibmeme</title>
    <style>
        /* Подгоняем шрифты и стили под общую тему bibmeme */
        body {
            background: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #bb86fc;
            text-align: center;
            border-bottom: 1px solid #2c2c2c;
            padding-bottom: 10px;
        }

        #oxel-chat-box {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user {
            background: #6200ee;
            color: #fff;
            align-self: flex-end;
        }

        .message.oxel {
            background: #2c2c2c;
            color: #fff;
            align-self: flex-start;
            border: 1px solid #444;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-family: sans-serif;
        }

        input[type="text"]:focus {
            border-color: #bb86fc;
        }

        button {
            padding: 10px 16px;
            background: #6200ee;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: sans-serif;
        }

        button:hover {
            background: #7c4dff;
        }
    </style>
</head>
<body>

    <h2>🤖 Помощник Oxel</h2>

    <!-- Окно чата -->
    <div id="oxel-chat-box">
        <div class="message oxel">Привет! Я Oxel, твой личный помощник в мире Bibmeme. Чем помочь?</div>
    </div>

    <!-- Поле ввода -->
    <div class="input-area">
        <input type="text" id="oxel-input" placeholder="Напиши сообщение Oxel..." onkeydown="checkEnter(event)">
        <button onclick="sendToOxel()">Отправить</button>
    </div>

    <script>
        function sendToOxel() {
            const input = document.getElementById('oxel-input');
            const chatBox = document.getElementById('oxel-chat-box');
            const text = input.value.trim();

            if (!text) return;

            // Сообщение пользователя
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = text;
            chatBox.appendChild(userMsg);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Ответ помощника (пока простой шаблонный, потом можно прикрутить ИИ)
            setTimeout(() => {
                const oxelMsg = document.createElement('div');
                oxelMsg.className = 'message oxel';
                oxelMsg.innerText = "Я зафиксировал твой запрос: «" + text + "». Скоро научусь отвечать умнее!";
                chatBox.appendChild(oxelMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendToOxel();
            }
        }
    </script>

</body>
</html>
