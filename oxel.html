<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxel — Помощник bibmeme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: white;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between p-4 select-none pt-8 overflow-x-hidden">

    <!-- Верхняя шапка -->
    <div class="flex items-center justify-between w-full max-w-sm mx-auto mb-4 border-b border-white/10 pb-3">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-2xl bg-blue-600 flex items-center justify-center font-bold text-base shadow-lg">🤖</div>
            <div>
                <h1 class="text-base font-extrabold tracking-tight">Oxel</h1>
                <span class="text-[10px] text-green-400 font-bold">● Помощник онлайн</span>
            </div>
        </div>
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition">
            ← На главную
        </a>
    </div>

    <!-- Основной контейнер чата / информации -->
    <div class="w-full max-w-sm mx-auto my-auto flex flex-col gap-3 flex-1 pb-4">
        
        <!-- Приветственная карточка Oxel -->
        <div class="bg-[#1e1e1e] border border-white/10 rounded-2xl p-4 shadow-lg flex flex-col gap-2.5">
            <div class="flex items-center gap-2">
                <span class="text-lg">👋</span>
                <h2 class="text-sm font-bold text-white">Знакомьтесь с Oxel</h2>
            </div>
            <p class="text-xs text-gray-300 leading-relaxed">
                Привет! Я <strong>Oxel</strong> — твой личный помощник в социальной сети <strong>bibmeme</strong>. Я знаю всё о приложении, а благодаря интернету могу ответить на любые другие твои вопросы!
            </p>
        </div>

        <!-- Быстрые вопросы (подсказки) -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[11px] font-bold text-indigo-400 px-1">Частые вопросы:</span>
            <div class="grid grid-cols-1 gap-1.5">
                <button onclick="askOxel('Как создать свой мем или пост?')" class="bg-[#1e1e1e] hover:bg-white/5 border border-white/10 p-2.5 rounded-xl text-xs text-left text-gray-200 transition">
                    💡 Как создать свой мем или пост?
                </button>
                <button onclick="askOxel('Зачем нужен закрытый профиль?')" class="bg-[#1e1e1e] hover:bg-white/5 border border-white/10 p-2.5 rounded-xl text-xs text-left text-gray-200 transition">
                    🔒 Зачем нужен закрытый профиль?
                </button>
            </div>
        </div>

        <!-- Окно диалога с Oxel -->
        <div id="oxelChatBox" class="bg-[#1e1e1e] border border-white/10 rounded-2xl p-3.5 flex flex-col gap-2.5 flex-1 min-h-[160px] max-h-[220px] overflow-y-auto">
            <div class="bg-[#121212] p-2.5 rounded-xl border border-white/10 text-xs text-gray-300">
                <strong class="text-blue-400">Oxel:</strong> Чем я могу помочь тебе сегодня? Спроси меня о чем угодно!
            </div>
        </div>
    </div>

    <!-- Панель ввода сообщения для Oxel -->
    <div class="w-full max-w-sm mx-auto bg-[#1e1e1e] border border-white/10 rounded-2xl p-2 flex gap-2 shadow-lg mt-auto">
        <input type="text" id="oxelInput" placeholder="Спросить Oxel..." class="flex-1 bg-[#121212] border border-white/20 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white" onkeydown="if(event.key==='Enter') sendOxelMessage()">
        <button onclick="sendOxelMessage()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
            Спросить
        </button>
    </div>

    <script>
        window.askOxel = function(question) {
            document.getElementById('oxelInput').value = question;
            sendOxelMessage();
        };

        window.sendOxelMessage = async function() {
            const input = document.getElementById('oxelInput');
            const chatBox = document.getElementById('oxelChatBox');
            const text = input.value.trim();

            if (!text) return;

            // Добавляем сообщение пользователя в чат
            chatBox.innerHTML += `
                <div class="bg-blue-600/20 border border-blue-500/30 p-2.5 rounded-xl text-xs text-white text-right ml-4">
                    <strong>Вы:</strong> ${text}
                </div>
            `;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Индикатор печати / загрузки из интернета
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="bg-[#121212] p-2.5 rounded-xl border border-white/10 text-xs text-gray-400 mr-4 animate-pulse">
                    <strong class="text-blue-400">Oxel:</strong> Думаю над ответом с использованием интернета...
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            let reply = "";
            const lower = text.toLowerCase();

            // 1. Проверяем локальные уникальные темы bibmeme и точные вопросы
            if (lower.includes("200") || lower.includes("300") || lower.includes("400") || lower.includes("военн")) {
                reply = `Объясняю подробно и обычно:<br><br>
                • <strong>«Груз 200» (погибшие)</strong>. Термин пошёл с советской войны в Афганистане, когда тела отправляли домой в цинковых гробах. Самая популярная версия: гроб с телом весил около 200 кг. Есть и версия, что это условный код в документах по перевозке грузов, но надёжных подтверждений такой кодировки нет.<br><br>
                • <strong>«Груз 300» (раненые/травмированные)</strong>. Это производное от «двухсотого»: раненый «почти» как погибший, но следующий по тяжести, поэтому следующая сотня. Это скорее логика ряда, чем какая-то технически обоснованная цифра.<br><br>
                • <strong>«Груз 400» (значения расходятся)</strong>. Тут единого толкования нет. Чаще всего встречается такое: «четырёхсотый» означает контуженного или человека, который сбежал / самовольно покинул часть. Также иногда так называют пленных. Говорят ещё про «груз 500» (отказник) и «груз 600» (пленный или крупногабарит), но расхождения от части к части большие.<br><br>
                Лучше всего устоялись только 200 и 300, остальные числа разные группы толкуют по-разному.`;
            } else if (lower.includes("пост") || lower.includes("мем") || lower.includes("создать")) {
                reply = "Чтобы создать пост, зайди во вкладку «Лента» в главном приложении и нажми синюю кнопку «Создайте свой первый пост!». Можешь добавить текст, фото и выбрать возрастное ограничение.";
            } else if (lower.includes("закрыт") || lower.includes("приват") || lower.includes("профиль")) {
                reply = "Закрытый (приватный) профиль защищает твои публикации. Чужие пользователи не смогут увидеть твои посты в ленте или через поиск, а увидят предупреждающую плашку.";
            } else if (lower.includes("сон") || lower.includes("спать") || lower.includes("возраст")) {
                reply = "Режим сна автоматически активируется для несовершеннолетних участников в зависимости от возраста (например, в 22:00 или 23:00), чтобы ты вовремя ложился спать!";
            } else if (lower.includes("пароль") || lower.includes("безопасн")) {
                reply = "Ты можешь защитить свой аккаунт надежным паролем через Настройки в своем Профиле. Пароль должен содержать от 6 символов, цифры, заглавную букву и символ подчёркивания (_).";
            } else {
                // 2. Если вопрос обычный/сторонний — обращаемся к публичному облачному API за ответом из интернета
                try {
                    const response = await fetch(`https://htmlka.com/api/ai?q=${encodeURIComponent(text)}`).catch(() => null);
                    if (response && response.ok) {
                        const data = await response.json();
                        reply = data.answer || data.result || "Я изучил информацию в интернете по твоему запросу, но ответа не нашлось. Попробуй спросить иначе!";
                    } else {
                        // Резервный умный ответ, если сеть недоступна
                        reply = `Я проанализировал твой вопрос («${text}»), но сейчас соединение с облачным сервером ограничено. Задай вопрос по поводу работы приложения bibmeme, и я с радостью помогу!`;
                    }
                } catch (e) {
                    reply = "Не удалось получить ответ из интернета. Проверь подключение к сети или задай вопрос по функционалу bibmeme!";
                }
            }

            // Убираем анимацию загрузки и выводим ответ Oxel
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `
                <div class="bg-[#121212] p-2.5 rounded-xl border border-white/10 text-xs text-gray-300 mr-4 leading-relaxed">
                    <strong class="text-blue-400">Oxel:</strong> ${reply}
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        };
    </script>
</body>
</html>
