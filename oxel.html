<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxel AI — Помощник bibmeme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: white;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between p-4 select-none max-w-sm mx-auto">

    <!-- Верхняя панель с кнопкой возврата -->
    <div class="flex items-center justify-between w-full mb-3 border-b border-white/10 pb-3">
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1">
            ← Назад в bibmeme
        </a>
        <h1 class="text-lg font-bold text-indigo-400">Oxel AI</h1>
    </div>

    <!-- Область чата -->
    <div id="chatMessages" class="flex-1 flex flex-col gap-3 overflow-y-auto mb-3 p-1 hide-scrollbar" style="max-height: 60vh;">
        <!-- Приветственное сообщение -->
        <div class="bg-[#1e1e1e] border border-indigo-500/30 rounded-2xl p-4 text-xs leading-relaxed text-gray-200 shadow-md">
            <span class="font-bold text-indigo-400">🤖 Oxel AI:</span><br>
            Привет! Я ваш умный ассистент Oxel. Выберите готовый вопрос ниже или напишите свой!
        </div>
    </div>

    <!-- Блок подсказок (быстрые вопросы) -->
    <div class="flex flex-col gap-1.5 mb-3">
        <p class="text-[10px] text-gray-400 font-bold px-1">Частые вопросы:</p>
        <button onclick="askPreset('Почему у меня Google авторизация не отображается?')" class="bg-[#1e1e1e] hover:bg-[#252525] border border-white/10 text-left text-xs text-gray-200 p-2.5 rounded-xl transition">
            ❓ Почему у меня Google авторизация не отображается?
        </button>
        <button onclick="askPreset('Что делать если забыл пароль от bibmeme?')" class="bg-[#1e1e1e] hover:bg-[#252525] border border-white/10 text-left text-xs text-gray-200 p-2.5 rounded-xl transition">
            ❓ Что делать если забыл пароль от bibmeme?
        </button>
        <button onclick="askPreset('Что делать если я не могу выйти из аккаунта')" class="bg-[#1e1e1e] hover:bg-[#252525] border border-white/10 text-left text-xs text-gray-200 p-2.5 rounded-xl transition">
            ❓ Что делать если я не могу выйти из аккаунта
        </button>
    </div>

    <!-- Форма ввода вопроса -->
    <div class="flex gap-2 w-full pt-2 border-t border-white/10">
        <input type="text" id="userInput" placeholder="Напишите вопрос..." class="flex-1 bg-[#1e1e1e] border border-white/20 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-3 rounded-xl text-xs transition shadow-md">
            Отправить
        </button>
    </div>

    <script>
        // Сохраненные ответы, работающие даже без интернета
        const offlineAnswers = {
            "почему у меня google авторизация не отображается?": 
                "Это может быть по причине:\n1. У вас включен ВПН. Выключите его. Если всё равно не прогружается ничего, то проблема в интернетах — проверьте подключение к интернету.\nА если у вас роутер работает с ВПНом, подключитесь тогда к другой сети или по мобильному интернету.",
            
            "что делать если забыл пароль от bibmeme?": 
                "Кажется, вы забыли пароль от bibmeme.\nВот пошаговый вариант, что с этим делать:\n1. Посмотреть пароль в Google Manager (если сохраняли вовремя). Вы должны войти в свой аккаунт и посмотреть сохраненный пароль от bibmeme.",
            
            "что делать если я не могу выйти из аккаунта": 
                "Это может быть причиной бага или интернета:\n1. Перезагрузите страницу (возможно, проблема в баге).\n2. Если не помогает перезагрузка, то проверьте подключение к интернету."
        };

        window.askPreset = function(questionText) {
            document.getElementById('userInput').value = questionText;
            sendMessage();
        };

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chatMessages');
            const text = input.value.trim();

            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'bg-indigo-600/30 border border-indigo-500/40 rounded-2xl p-3 text-xs text-white self-end text-right max-w-[85%]';
            userMsg.textContent = text;
            chat.appendChild(userMsg);

            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const queryLower = text.toLowerCase();

            setTimeout(() => {
                if (offlineAnswers[queryLower]) {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'bg-[#1e1e1e] border border-indigo-500/30 rounded-2xl p-4 text-xs leading-relaxed text-gray-200 shadow-md max-w-[85%] whitespace-pre-line';
                    aiMsg.innerHTML = `<span class="font-bold text-indigo-400">🤖 Oxel AI:</span>\n${offlineAnswers[queryLower]}`;
                    chat.appendChild(aiMsg);
                    chat.scrollTop = chat.scrollHeight;
                } else {
                    if (typeof navigator.onLine !== 'undefined' && !navigator.onLine) {
                        const aiMsg = document.createElement('div');
                        aiMsg.className = 'bg-[#1e1e1e] border border-red-500/30 rounded-2xl p-4 text-xs leading-relaxed text-red-300 shadow-md max-w-[85%]';
                        aiMsg.innerHTML = `<span class="font-bold text-red-400">🤖 Oxel AI:</span><br>Нету подключения к интернету. Проверьте подключения в настройки, или повторите попытку, если это произошло по ошибке.`;
                        chat.appendChild(aiMsg);
                        chat.scrollTop = chat.scrollHeight;
                    } else {
                        const aiMsg = document.createElement('div');
                        aiMsg.className = 'bg-[#1e1e1e] border border-indigo-500/30 rounded-2xl p-4 text-xs leading-relaxed text-gray-200 shadow-md max-w-[85%]';
                        aiMsg.innerHTML = `<span class="font-bold text-indigo-400">🤖 Oxel AI:</span><br>Я пока не знаю ответа на этот вопрос, но обязательно научусь! Используйте частые вопросы выше.`;
                        chat.appendChild(aiMsg);
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            }, 400);
        }

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
