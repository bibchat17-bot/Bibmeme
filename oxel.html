<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxel — Помощник bibmeme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: white;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between p-4 select-none pt-8 overflow-x-hidden">

    <!-- Верхняя шапка -->
    <div class="flex items-center justify-between w-full max-w-sm mx-auto mb-4 border-b border-white/10 pb-3">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-2xl bg-blue-600 flex items-center justify-center font-bold text-base shadow-lg">🤖</div>
            <div>
                <h1 class="text-base font-extrabold tracking-tight">Oxel</h1>
                <span class="text-[10px] text-green-400 font-bold">● Помощник онлайн</span>
            </div>
        </div>
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition">
            ← На главную
        </a>
    </div>

    <!-- Основной контейнер чата / информации -->
    <div class="w-full max-w-sm mx-auto my-auto flex flex-col gap-3 flex-1 pb-4">
        
        <!-- Приветственная карточка Oxel -->
        <div class="bg-[#1e1e1e] border border-white/10 rounded-2xl p-4 shadow-lg flex flex-col gap-2.5">
            <div class="flex items-center gap-2">
                <span class="text-lg">👋</span>
                <h2 class="text-sm font-bold text-white">Знакомьтесь с Oxel</h2>
            </div>
            <p class="text-xs text-gray-300 leading-relaxed">
                Привет! Я <strong>Oxel</strong> — твой личный помощник в социальной сети <strong>bibmeme</strong>. Я умею считать, точно переводить любые слова и фразы через интернет, а также отвечать на любые вопросы.
            </p>
        </div>

        <!-- Пустое окно диалога -->
        <div id="oxelChatBox" class="bg-[#1e1e1e] border border-white/10 rounded-2xl p-3.5 flex flex-col gap-2.5 flex-1 min-h-[220px] max-h-[280px] overflow-y-auto">
        </div>
    </div>

    <!-- Панель ввода сообщения для Oxel -->
    <div class="w-full max-w-sm mx-auto bg-[#1e1e1e] border border-white/10 rounded-2xl p-2 flex gap-2 shadow-lg mt-auto">
        <input type="text" id="oxelInput" placeholder="Задайте любой вопрос" class="flex-1 bg-[#121212] border border-white/20 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white" onkeydown="if(event.key==='Enter') sendOxelMessage()">
        <button onclick="sendOxelMessage()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
            Отправить
        </button>
    </div>

    <script>
        // Функция точного интернет-перевода фраз и слов
        async function fetchOnlineTranslation(text) {
            let lower = text.toLowerCase();
            let targetLang = "en";
            if (lower.includes("азербайджан") || lower.includes("аз")) targetLang = "az";
            else if (lower.includes("китай") || lower.includes("китайск")) targetLang = "zh";
            else if (lower.includes("русск")) targetLang = "ru";

            let phraseToTranslate = text;
            let match = text.match(/["«](.+?)["»]/);
            if (match && match[1]) {
                phraseToTranslate = match[1];
            } else {
                phraseToTranslate = text.replace(/переведи|перевести|на|английский|русский|азербайджанский|китайский|язык/gi, "").trim();
            }

            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(phraseToTranslate)}&langpair=auto|${targetLang}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.responseData && data.responseData.translatedText) {
                        return `🌍 Перевод («${phraseToTranslate}»):<br><strong>${data.responseData.translatedText}</strong>`;
                    }
                }
            } catch (e) {}

            return `🌍 Перевод фразы «<strong>${phraseToTranslate}</strong>»: <br><strong>[ ${phraseToTranslate} ]</strong>`;
        }

        window.sendOxelMessage = async function() {
            const input = document.getElementById('oxelInput');
            const chatBox = document.getElementById('oxelChatBox');
            const text = input.value.trim();

            if (!text) return;

            // Добавляем сообщение пользователя в чат
            chatBox.innerHTML += `
                <div class="bg-blue-600/20 border border-blue-500/30 p-2.5 rounded-xl text-xs text-white text-right ml-4">
                    <strong>Вы:</strong> ${text}
                </div>
            `;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Индикатор загрузки
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="bg-[#121212] p-2.5 rounded-xl border border-white/10 text-xs text-gray-400 mr-4 animate-pulse">
                    <strong class="text-blue-400">Oxel:</strong> Ищу ответ...
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            let reply = "";
            const lower = text.toLowerCase();

            // 1. Калькулятор
            const mathClean = text.replace(/сколько будет|посчитай|=|\?/gi, "").trim();
            const isMath = /^[0-9\s\+\-\*\/\(\)\.\,xX]+$/.test(mathClean) && /[0-9]/.test(mathClean) && /[\+\-\*\/\xX]/.test(mathClean);

            if (isMath) {
                try {
                    let evalStr = mathClean.replace(/x/gi, '*').replace(/,/g, '.');
                    let calcResult = Function('"use strict";return (' + evalStr + ')')();
                    reply = `🧮 Результат: <strong>${calcResult}</strong>`;
                } catch (e) {
                    reply = "Ошибка в математическом примере.";
                }
            } 
            // 2. Переводчик через интернет
            else if (lower.includes("перевод") || lower.includes("переведи") || lower.includes("translate")) {
                reply = await fetchOnlineTranslation(text);
            }
            // 3. Военные термины
            else if (lower.includes("200") || lower.includes("300") || lower.includes("400") || lower.includes("военн")) {
                reply = `Объясняю подробно:<br><br>
                • <strong>«Груз 200»</strong> — погибшие (термин из Афганистана, ориентировочный вес гроба).<br>
                • <strong>«Груз 300»</strong> — раненые.<br>
                • <strong>«Груз 400»</strong> — контуженные или дезертиры.`;
            } 
            // 4. Функционал bibmeme
            else if (lower.includes("пост") || lower.includes("мем") || lower.includes("создать")) {
                reply = "Чтобы создать пост, зайди в «Ленту» и нажми кнопку создания публикации.";
            } else if (lower.includes("закрыт") || lower.includes("приват") || lower.includes("профиль")) {
                reply = "Закрытый профиль скрывает твои посты от посторонних в ленте и поиске.";
            } 
            // 5. Поиск ответов в интернете
            else {
                try {
                    const response = await fetch(`https://htmlka.com/api/ai?q=${encodeURIComponent(text)}`).catch(() => null);
                    if (response && response.ok) {
                        const data = await response.json();
                        reply = data.answer || data.result || "Вот что удалось найти по твоему запросу в интернете.";
                    } else {
                        reply = `Ответ на запрос «${text}»: интернет-соединение временно недоступно.`;
                    }
                } catch (e) {
                    reply = "Ошибка сети интернет.";
                }
            }

            // Убираем загрузку и выводим ответ
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `
                <div class="bg-[#121212] p-2.5 rounded-xl border border-white/10 text-xs text-gray-300 mr-4 leading-relaxed">
                    <strong class="text-blue-400">Oxel:</strong> ${reply}
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        };
    </script>
</body>
</html>
