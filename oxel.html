<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxel AI — Помощник bibmeme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: white;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between p-4 select-none max-w-sm mx-auto">

    <!-- Верхняя панель с кнопкой возврата -->
    <div class="flex items-center justify-between w-full mb-4 border-b border-white/10 pb-3">
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1">
            ← Назад в bibmeme
        </a>
        <h1 class="text-lg font-bold text-indigo-400">Oxel AI</h1>
    </div>

    <!-- Область чата -->
    <div id="chatMessages" class="flex-1 flex flex-col gap-3 overflow-y-auto mb-4 p-1 hide-scrollbar" style="max-height: 75vh;">
        <!-- Приветственное сообщение -->
        <div class="bg-[#1e1e1e] border border-indigo-500/30 rounded-2xl p-4 text-xs leading-relaxed text-gray-200 shadow-md">
            <span class="font-bold text-indigo-400">🤖 Oxel AI:</span><br>
            Привет! Я ваш умный ассистент Oxel. Задайте мне любой вопрос по работе bibmeme, созданию постов или правилам соцсети!
        </div>
    </div>

    <!-- Форма ввода вопроса -->
    <div class="flex gap-2 w-full pt-2 border-t border-white/10">
        <input type="text" id="userInput" placeholder="Напишите вопрос..." class="flex-1 bg-[#1e1e1e] border border-white/20 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-3 rounded-xl text-xs transition shadow-md">
            Отправить
        </button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chatMessages');
            const text = input.value.trim();

            if (!text) return;

            // Сообщение пользователя
            const userMsg = document.createElement('div');
            userMsg.className = 'bg-indigo-600/30 border border-indigo-500/40 rounded-2xl p-3 text-xs text-white self-end text-right max-w-[85%]';
            userMsg.textContent = text;
            chat.appendChild(userMsg);

            input.value = '';

            // Ответ ИИ (эмуляция ответов по проекту)
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'bg-[#1e1e1e] border border-indigo-500/30 rounded-2xl p-4 text-xs leading-relaxed text-gray-200 shadow-md max-w-[85%]';
                
                let reply = "Я пока на стадии обучения, но скоро буду отвечать на все вопросы в реальном времени!";
                const query = text.toLowerCase();

                if (query.includes('пост') || query.includes('опубликовать')) {
                    reply = "Чтобы выложить пост, войдите в аккаунт, перейдите во вкладку «Лента» и нажмите синюю кнопку «Создайте свой первый пост!».";
                } else if (query.includes('пароль')) {
                    reply = "Пароль можно настроить во вкладке «Профиль». Он должен содержать от 6 символов, минимум 2 цифры, заглавную букву и спецсимвол (_).";
                } else if (query.includes('удалить')) {
                    reply = "Удалить аккаунт или пост можно в любое время. Для аккаунта перейдите в Профиль -> Удалить аккаунт и подтвердите действие двумя галочками.";
                } else if (query.includes('сон') || query.includes('время')) {
                    reply = "В bibmeme действует автоматический режим сна для защиты детей. Доступ ограничивается ночью в зависимости от вашего возраста.";
                }

                aiMsg.innerHTML = `<span class="font-bold text-indigo-400">🤖 Oxel AI:</span><br>${reply}`;
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
