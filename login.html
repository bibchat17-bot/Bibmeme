<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход через Google — bibmeme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center max-w-sm w-full flex flex-col gap-4 shadow-xl">
        <h1 class="text-xl font-bold">bibmeme</h1>
        <p id="statusText" class="text-xs text-gray-400">Подготовка входа...</p>

        <button id="startAuthBtn" class="hidden w-full bg-white text-black font-bold p-3.5 rounded-xl text-sm hover:bg-gray-200 transition flex items-center justify-center gap-2.5 cursor-pointer shadow-md">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.16 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.2C.44 8.13 0 9.87 0 11.75s.44 3.62 1.2 5.15l4.08-2.65z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.16 2.68 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg> 
            Выбрать аккаунт Google
        </button>

        <div id="spinner" class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>

        <a href="index.html" class="text-xs text-gray-500 hover:text-gray-300 transition">← На главную</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, GoogleAuthProvider, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:30b65e2900685b66817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const btn = document.getElementById('startAuthBtn');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');

        async function initLogin() {
            try {
                // 1. Проверяем, вернулись ли мы уже с результатами авторизации Google
                const result = await getRedirectResult(auth);
                if (result && result.user) {
                    statusText.textContent = "Успешно! Переход на сайт...";
                    window.location.replace("index.html");
                    return;
                }

                // 2. Сбрасываем старый зависший кэш сессии, чтобы открылось окно выбора аккаунта
                await signOut(auth);

                // 3. Сразу запускаем редирект на Google
                statusText.textContent = "Открываем выбор аккаунта Google...";
                await signInWithRedirect(auth, provider);

            } catch (err) {
                console.error(err);
                statusText.textContent = "Нажмите кнопку для входа:";
                spinner.classList.add('hidden');
                btn.classList.remove('hidden');
            }
        }

        // Ручной клик, если авто-редирект заблокирован браузером
        btn.addEventListener('click', async () => {
            btn.classList.add('hidden');
            spinner.classList.remove('hidden');
            statusText.textContent = "Переход в Google...";
            await signInWithRedirect(auth, provider);
        });

        initLogin();
    </script>
</body>
</html>
