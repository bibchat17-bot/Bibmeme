<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход через Google — bibmeme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#1e1e1e] border border-white/20 rounded-2xl p-6 text-center max-w-sm w-full flex flex-col gap-4 shadow-xl">
        <h1 class="text-xl font-bold">bibmeme</h1>
        <p id="statusText" class="text-xs text-gray-400">Перенаправление на Google...</p>
        <div id="spinner" class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, GoogleAuthProvider, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:30b65e2900685b66817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        async function processLogin() {
            try {
                // 1. Сначала проверяем, вернулись ли мы с результатами входа Google
                const result = await getRedirectResult(auth);
                
                if (result && result.user) {
                    document.getElementById('statusText').textContent = "Успешно! Возврат на главный экран...";
                    window.location.replace("index.html");
                    return;
                }

                // 2. Проверяем, если пользователь УЖЕ авторизован в системе
                if (auth.currentUser) {
                    document.getElementById('statusText').textContent = "Вы уже вошли! Переходим...";
                    window.location.replace("index.html");
                    return;
                }

                // 3. Если зашли в login.html в первый раз — отправляем в Google
                document.getElementById('statusText').textContent = "Открываем выбор аккаунта Google...";
                await signInWithRedirect(auth, provider);

            } catch (error) {
                console.error("Ошибка авторизации:", error);
                document.getElementById('statusText').textContent = "Ошибка: " + error.message;
                document.getElementById('spinner').classList.add('hidden');
            }
        }

        processLogin();
    </script>
</body>
</html>
